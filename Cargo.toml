[package]
name = "fx-torrent"
version = "0.10.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "FX Torrent is a feature rich Bittorrent protocol implementation written in rust supporting Linux, MacOS and Windows."
keywords = ["bittorrent", "libtorrent", "torrent", "magnet", "dht"]
repository = "https://github.com/yoep/fx-torrent"
readme = "README.md"
exclude = [
    ".config",
    ".github",
    "docs/*",
    "examples/*",
    "target/*",
    "test/*",
    "torrents/*",
    ".bumpversion.toml",
    "Makefile",
]

[lib]
crate-type = ["rlib"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", optional = true }
base32 = "0.5"
base64 = "0.23"
bitvec = "1.1"
bitmask-enum = "2.2"
byteorder = "1.5"
crc = "3.4"
derive_more = { version = "2.1", features = ["display"] }
ed25519 = { version = "3.0", optional = true }
ed25519-dalek = { version = "3.0", optional = true }
futures = "0.3"
fx-callback = "2.0"
fx-handle = "1.0"
hex = "0.4"
itertools = "0.15"
log = "0.4"
percent-encoding = "2.3"
rand = "0.10"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "macros"] }
tokio-util = "0.7"
tracing = { version = "0.1", optional = true }
tracing-futures = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
url = "2.5"

[features]
default = ["dht", "extension-metadata", "extension-pex", "extension-donthave", "lsd", "tracker-server"]

dht = ["dep:ed25519", "dep:ed25519-dalek"]
extension-donthave = []
extension-metadata = []
extension-pex = []
lsd = []
tracing = [
    "dep:tracing",
    "dep:tracing-futures",
    "dep:tracing-subscriber",
    "tokio/tracing"
]
tracker-server = ["dep:axum"]

[dev-dependencies]
chrono = "0.4"
console-subscriber = "0.5"
crossterm = { version = "0.29", features = ["event-stream"] }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
httpmock = "0.8.3"
log4rs = { version = "1.4", features = ["console_writer"] }
mockall = "0.15"
ratatui = "0.30"
tempfile = "3.27"
tokio = { version = "1.53", features = ["signal"] }

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc"
]

[[example]]
name = "cli"
path = "examples/cli/main.rs"
required-features = ["tracing"]

[[example]]
name = "dht-get-item"
path = "examples/dht-get-item/main.rs"
required-features = []
